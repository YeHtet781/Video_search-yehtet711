<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Video Search</title>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      font-family: Arial, sans-serif;
      background: #111;
      color: white;
    }

    header {
      padding: 30px 15px;
      text-align: center;
      background: #181818;
    }

    h1 {
      margin: 0 0 20px;
      font-size: 30px;
    }

    .search {
      display: flex;
      max-width: 650px;
      margin: auto;
    }

    input {
      flex: 1;
      padding: 15px;
      border: none;
      outline: none;
      font-size: 16px;
      border-radius: 8px 0 0 8px;
    }

    button {
      padding: 15px 22px;
      border: none;
      background: #e50914;
      color: white;
      font-size: 16px;
      cursor: pointer;
      border-radius: 0 8px 8px 0;
    }

    button:hover {
      background: #b20710;
    }

    main {
      max-width: 900px;
      margin: 30px auto;
      padding: 0 15px;
    }

    #message {
      text-align: center;
      color: #aaa;
      margin-top: 50px;
      font-size: 17px;
    }
  </style>
</head>

<body>

  <header>
    <h1>🎬 Video Search</h1>

    <div class="search">
      <input
        id="searchInput"
        type="text"
        placeholder="Search video..."
        onkeydown="handleEnter(event)"
      >

      <button onclick="searchVideo()">Search</button>
    </div>
  </header>

  <main>
    <div id="message">
      Search for a video
    </div>
  </main>

  <script>
    function searchVideo() {
      const input = document.getElementById("searchInput");
      const keyword = input.value.trim();

      if (!keyword) {
        document.getElementById("message").textContent =
          "Please enter a search word.";
        return;
      }

      const youtubeURL =
        "https://www.youtube.com/results?search_query=" +
        encodeURIComponent(keyword);

      window.location.href = youtubeURL;
    }

    function handleEnter(event) {
      if (event.key === "Enter") {
        searchVideo();
      }
    }
  </script>

</body>
</html>
