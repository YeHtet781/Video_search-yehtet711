<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Video Search</title>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      background: #111;
      color: white;
      font-family: Arial, sans-serif;
    }

    header {
      background: #181818;
      padding: 30px 15px;
      text-align: center;
    }

    h1 {
      margin: 0 0 20px;
      font-size: 30px;
    }

    .tabs {
      display: flex;
      justify-content: center;
      gap: 10px;
      margin-bottom: 18px;
    }

    .tab {
      padding: 11px 22px;
      border: none;
      border-radius: 8px;
      background: #333;
      color: white;
      cursor: pointer;
      font-size: 15px;
    }

    .tab.active {
      background: #e50914;
    }

    .search {
      display: flex;
      max-width: 650px;
      margin: auto;
    }

    input {
      flex: 1;
      padding: 15px;
      border: none;
      outline: none;
      font-size: 16px;
      border-radius: 8px 0 0 8px;
    }

    .search-btn {
      padding: 15px 22px;
      border: none;
      background: #e50914;
      color: white;
      font-size: 16px;
      border-radius: 0 8px 8px 0;
      cursor: pointer;
    }

    main {
      max-width: 900px;
      margin: 30px auto;
      padding: 0 15px;
    }

    #message {
      text-align: center;
      color: #aaa;
      margin: 45px 0;
    }

    .player {
      position: relative;
      width: 100%;
      padding-bottom: 56.25%;
      background: black;
      border-radius: 12px;
      overflow: hidden;
    }

    .player iframe {
      position: absolute;
      width: 100%;
      height: 100%;
      border: 0;
      left: 0;
      top: 0;
    }

    .info {
      background: #1d1d1d;
      padding: 18px;
      margin-top: 15px;
      border-radius: 10px;
    }

    .info p {
      color: #aaa;
    }
  </style>
</head>

<body>

  <header>

    <h1>🎬 Video Search</h1>

    <div class="tabs">

      <button
        id="youtubeTab"
        class="tab active"
        onclick="selectSource('youtube')">
        YouTube
      </button>

      <button
        id="telegramTab"
        class="tab"
        onclick="selectSource('telegram')">
        Telegram
      </button>

    </div>

    <div class="search">

      <input
        id="searchInput"
        type="text"
        placeholder="Paste YouTube video link..."
      >

      <button
        class="search-btn"
        onclick="searchVideo()">
        Search
      </button>

    </div>

  </header>


  <main>

    <div id="message">
      Paste a YouTube video link to watch it here.
    </div>

    <div id="videoArea"></div>

  </main>


  <script>

    let source = "youtube";


    function selectSource(type) {

      source = type;

      const input =
        document.getElementById("searchInput");

      const youtubeTab =
        document.getElementById("youtubeTab");

      const telegramTab =
        document.getElementById("telegramTab");


      youtubeTab.classList.remove("active");
      telegramTab.classList.remove("active");


      if (type === "youtube") {

        youtubeTab.classList.add("active");

        input.placeholder =
          "Paste YouTube video link...";

        document.getElementById("message").textContent =
          "Paste a YouTube video link to watch it here.";

      }


      if (type === "telegram") {

        telegramTab.classList.add("active");

        input.placeholder =
          "Paste public Telegram post link...";

        document.getElementById("message").textContent =
          "Paste a public Telegram post link.";

      }


      document.getElementById("videoArea").innerHTML = "";

    }



    function getYouTubeID(url) {

      try {

        const link = new URL(url);

        if (link.hostname.includes("youtu.be")) {

          return link.pathname.substring(1);

        }

        if (link.hostname.includes("youtube.com")) {

          return link.searchParams.get("v");

        }

        return null;

      } catch {

        return null;

      }

    }



    function searchVideo() {

      const input =
        document.getElementById("searchInput");

      const value =
        input.value.trim();

      const message =
        document.getElementById("message");

      const videoArea =
        document.getElementById("videoArea");


      if (!value) {

        message.textContent =
          "Please enter a link.";

        videoArea.innerHTML = "";

        return;

      }



      if (source === "youtube") {

        const videoID =
          getYouTubeID(value);


        if (!videoID) {

          message.textContent =
            "Please enter a valid YouTube video link.";

          videoArea.innerHTML = "";

          return;

        }


        message.textContent = "";


        videoArea.innerHTML = `

          <div class="player">

            <iframe
              src="https://www.youtube.com/embed/${videoID}"
              allow="accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture; web-share"
              allowfullscreen>
            </iframe>

          </div>

          <div class="info">

            <h2>🎬 YouTube Video</h2>

            <p>
              This video is playing inside your website.
            </p>

          </div>

        `;

        return;

      }



      if (source === "telegram") {

        if (
          !value.includes("t.me/") &&
          !value.includes("telegram.me/")
        ) {

          message.textContent =
            "Please enter a public Telegram link.";

          videoArea.innerHTML = "";

          return;

        }


        message.textContent =
          "Opening public Telegram post...";


        videoArea.innerHTML = `

          <div class="info">

            <h2>📱 Telegram</h2>

            <p>
              This public Telegram post cannot always be
              embedded as a video. Use the button below
              to open the public post.
            </p>

            <button
              class="search-btn"
              onclick="window.open('${value}', '_blank')">
              Open Telegram Post
            </button>

          </div>

        `;

      }

    }

  </script>

</body>
</html>
