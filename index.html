<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Video Search</title>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      font-family: Arial, sans-serif;
      background: #111;
      color: white;
    }

    header {
      padding: 25px 15px;
      text-align: center;
      background: #181818;
    }

    h1 {
      margin: 0 0 18px;
      font-size: 28px;
    }

    .search {
      display: flex;
      max-width: 600px;
      margin: auto;
    }

    input {
      flex: 1;
      padding: 14px;
      border: none;
      outline: none;
      font-size: 16px;
      border-radius: 8px 0 0 8px;
    }

    button {
      padding: 14px 20px;
      border: none;
      background: #e50914;
      color: white;
      font-size: 16px;
      cursor: pointer;
      border-radius: 0 8px 8px 0;
    }

    main {
      max-width: 1000px;
      margin: 25px auto;
      padding: 0 15px;
    }

    .video {
      background: #1d1d1d;
      margin-bottom: 18px;
      padding: 15px;
      border-radius: 10px;
    }

    .video h2 {
      font-size: 19px;
      margin: 0 0 8px;
    }

    .video p {
      color: #aaa;
      margin: 0;
    }

    #message {
      text-align: center;
      color: #aaa;
      margin-top: 40px;
    }
  </style>
</head>

<body>

  <header>
    <h1>🎬 Video Search</h1>

    <div class="search">
      <input id="searchInput" type="text" placeholder="Search video...">
      <button onclick="searchVideo()">Search</button>
    </div>
  </header>

  <main>
    <div id="results"></div>
    <div id="message">Search for a video</div>
  </main>

  <script>
    const videos = [
      {
        title: "Sample Video 1",
        description: "This is a sample video result."
      },
      {
        title: "Sample Video 2",
        description: "Another sample video result."
      },
      {
        title: "Funny Video",
        description: "A funny video example."
      }
    ];

    function searchVideo() {
      const keyword =
        document.getElementById("searchInput").value.toLowerCase().trim();

      const results = document.getElementById("results");
      const message = document.getElementById("message");

      results.innerHTML = "";

      if (!keyword) {
        message.textContent = "Please enter a search word.";
        return;
      }

      const found = videos.filter(video =>
        video.title.toLowerCase().includes(keyword) ||
        video.description.toLowerCase().includes(keyword)
      );

      if (found.length === 0) {
        message.textContent = "No videos found.";
        return;
      }

      message.textContent = "";

      found.forEach(video => {
        results.innerHTML += `
          <div class="video">
            <h2>${video.title}</h2>
            <p>${video.description}</p>
          </div>
        `;
      });
    }
  </script>

</body>
</html>
