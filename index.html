<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Video Search</title>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      background: #111;
      color: white;
      font-family: Arial, sans-serif;
    }

    header {
      background: #181818;
      padding: 30px 15px;
      text-align: center;
    }

    h1 {
      margin: 0 0 20px;
    }

    .search {
      display: flex;
      max-width: 650px;
      margin: auto;
    }

    input {
      flex: 1;
      padding: 15px;
      border: none;
      outline: none;
      font-size: 16px;
      border-radius: 8px 0 0 8px;
    }

    button {
      padding: 15px 22px;
      border: none;
      background: #e50914;
      color: white;
      font-size: 16px;
      border-radius: 0 8px 8px 0;
      cursor: pointer;
    }

    main {
      max-width: 900px;
      margin: 30px auto;
      padding: 0 15px;
    }

    .player {
      position: relative;
      width: 100%;
      padding-bottom: 56.25%;
      margin-top: 25px;
      background: black;
      border-radius: 12px;
      overflow: hidden;
    }

    .player iframe {
      position: absolute;
      width: 100%;
      height: 100%;
      border: 0;
      left: 0;
      top: 0;
    }

    .info {
      margin-top: 20px;
      padding: 20px;
      background: #1d1d1d;
      border-radius: 10px;
    }

    .info p {
      color: #aaa;
    }

    #message {
      text-align: center;
      color: #aaa;
      margin-top: 50px;
    }
  </style>
</head>

<body>

  <header>
    <h1>🎬 Video Search</h1>

    <div class="search">
      <input
        id="searchInput"
        type="text"
        placeholder="Paste YouTube video link..."
      >

      <button onclick="loadVideo()">
        Watch
      </button>
    </div>
  </header>

  <main>

    <div id="message">
      Paste a YouTube video link to watch it here.
    </div>

    <div id="videoArea"></div>

  </main>

  <script>

    function getVideoID(url) {

      try {

        const link = new URL(url);

        if (link.hostname.includes("youtu.be")) {
          return link.pathname.substring(1);
        }

        if (link.hostname.includes("youtube.com")) {
          return link.searchParams.get("v");
        }

        return null;

      } catch {
        return null;
      }
    }


    function loadVideo() {

      const input =
        document.getElementById("searchInput").value.trim();

      const videoID = getVideoID(input);

      const videoArea =
        document.getElementById("videoArea");

      const message =
        document.getElementById("message");


      if (!videoID) {

        message.textContent =
          "Please paste a valid YouTube video link.";

        videoArea.innerHTML = "";

        return;
      }


      message.textContent = "";


      videoArea.innerHTML = `

        <div class="player">

          <iframe
            src="https://www.youtube.com/embed/${videoID}"
            allow="accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture; web-share"
            allowfullscreen>
          </iframe>

        </div>

        <div class="info">

          <h2>🎬 Video Player</h2>

          <p>
            You are watching this video inside the website.
          </p>

        </div>

      `;
    }

  </script>

</body>
</html>
