<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Video Search</title>
<meta name="google-site-verification" content="NLze5vFPaPeV8_LIbFKl7K_zwE3l9137-d7dpILDV9o" />
  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      font-family: Arial, sans-serif;
      background: #f5f5f5;
      color: #222;
    }

    header {
      background: #111;
      color: white;
      text-align: center;
      padding: 25px 15px;
    }

    header h1 {
      margin: 0 0 8px;
      font-size: 30px;
    }

    header p {
      margin: 0;
      color: #bbb;
    }

    .search-box {
      max-width: 650px;
      margin: 30px auto;
      padding: 0 15px;
      display: flex;
      gap: 8px;
    }

    .search-box input {
      flex: 1;
      padding: 15px;
      border: 1px solid #ccc;
      border-radius: 10px;
      font-size: 16px;
    }

    .search-box button {
      padding: 15px 20px;
      border: none;
      border-radius: 10px;
      background: #e60000;
      color: white;
      font-size: 16px;
      cursor: pointer;
    }

    .results {
      max-width: 900px;
      margin: auto;
      padding: 0 15px 40px;
    }

    .video {
      background: white;
      margin-bottom: 15px;
      padding: 15px;
      border-radius: 12px;
      box-shadow: 0 2px 8px rgba(0,0,0,0.08);
    }

    .video h3 {
      margin: 0 0 8px;
    }

    .video a {
      color: #e60000;
      text-decoration: none;
    }

    .message {
      text-align: center;
      color: #777;
      padding: 30px;
    }
  </style>
</head>

<body>

  <header>
    <h1>🎬 Video Search</h1>
    <p>Search videos easily</p>
  </header>

  <div class="search-box">
    <input id="searchInput" type="text" placeholder="Search videos...">
    <button onclick="searchVideos()">Search</button>
  </div>

  <div id="results" class="results">
    <div class="message">
      Type something above and press Search.
    </div>
  </div>

  <script>
    function searchVideos() {
      const query = document.getElementById("searchInput").value.trim();
      const results = document.getElementById("results");

      if (!query) {
        results.innerHTML =
          '<div class="message">Please enter something to search.</div>';
        return;
      }

      const youtubeUrl =
        "https://www.youtube.com/results?search_query=" +
        encodeURIComponent(query);

      results.innerHTML = `
        <div class="video">
          <h3>🔎 Search results for: ${query}</h3>
          <p>Click below to see videos.</p>
          <a href="${youtubeUrl}" target="_blank">
            Open YouTube Video Results →
          </a>
        </div>
      `;
    }
  </script>

</body>
</html>
