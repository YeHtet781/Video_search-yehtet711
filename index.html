<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Video Search</title>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      background: #111;
      color: white;
      font-family: Arial, sans-serif;
    }

    header {
      background: #181818;
      padding: 30px 15px;
      text-align: center;
    }

    h1 {
      margin: 0 0 20px;
    }

    .tabs {
      display: flex;
      justify-content: center;
      gap: 10px;
      margin-bottom: 18px;
    }

    .tab {
      padding: 11px 22px;
      border: 0;
      border-radius: 8px;
      background: #333;
      color: white;
      cursor: pointer;
    }

    .tab.active {
      background: #e50914;
    }

    .search {
      display: flex;
      max-width: 650px;
      margin: auto;
    }

    input {
      flex: 1;
      padding: 15px;
      border: 0;
      outline: 0;
      font-size: 16px;
      border-radius: 8px 0 0 8px;
    }

    .search-btn {
      padding: 15px 22px;
      border: 0;
      background: #e50914;
      color: white;
      cursor: pointer;
      border-radius: 0 8px 8px 0;
    }

    main {
      max-width: 900px;
      margin: 30px auto;
      padding: 0 15px;
    }

    #message {
      text-align: center;
      color: #aaa;
      margin: 40px 0;
    }

    .embed-box {
      background: #1d1d1d;
      padding: 15px;
      border-radius: 12px;
      overflow: hidden;
    }
  </style>

  <!-- Telegram official embed script -->
  <script async
    src="https://telegram.org/js/telegram-widget.js?22"
    data-telegram-post="channelname123456/336"
    data-width="100%">
  </script>

</head>

<body>

  <header>

    <h1>🎬 Video Search</h1>

    <div class="tabs">

      <button
        id="youtubeTab"
        class="tab active"
        onclick="selectSource('youtube')">
        YouTube
      </button>

      <button
        id="telegramTab"
        class="tab"
        onclick="selectSource('telegram')">
        Telegram
      </button>

    </div>

    <div class="search">

      <input
        id="searchInput"
        type="text"
        placeholder="Paste YouTube video link..."
      >

      <button
        class="search-btn"
        onclick="searchVideo()">
        Search
      </button>

    </div>

  </header>


  <main>

    <div id="message">
      Paste a video link to watch it here.
    </div>

    <div id="videoArea"></div>

  </main>


  <script>

    let source = "youtube";


    function selectSource(type) {

      source = type;

      const input =
        document.getElementById("searchInput");

      document
        .getElementById("youtubeTab")
        .classList.toggle("active", type === "youtube");

      document
        .getElementById("telegramTab")
        .classList.toggle("active", type === "telegram");


      if (type === "youtube") {

        input.placeholder =
          "Paste YouTube video link...";

        document.getElementById("message").textContent =
          "Paste a YouTube video link.";

      } else {

        input.placeholder =
          "Paste public Telegram post link...";

        document.getElementById("message").textContent =
          "Paste a public Telegram post link.";

      }


      document.getElementById("videoArea").innerHTML = "";

    }



    function getYouTubeID(url) {

      try {

        const link = new URL(url);

        if (link.hostname.includes("youtu.be")) {
          return link.pathname.substring(1);
        }

        if (link.hostname.includes("youtube.com")) {
          return link.searchParams.get("v");
        }

        return null;

      } catch {

        return null;

      }

    }



    function getTelegramPost(url) {

      try {

        const link = new URL(url);

        if (!link.hostname.includes("t.me")) {
          return null;
        }

        const parts =
          link.pathname
            .split("/")
            .filter(Boolean);

        if (parts.length < 2) {
          return null;
        }

        return parts[0] + "/" + parts[1];

      } catch {

        return null;

      }

    }



    function searchVideo() {

      const value =
        document
          .getElementById("searchInput")
          .value
          .trim();

      const message =
        document.getElementById("message");

      const videoArea =
        document.getElementById("videoArea");


      if (!value) {

        message.textContent =
          "Please enter a video link.";

        videoArea.innerHTML = "";

        return;

      }



      if (source === "youtube") {

        const id =
          getYouTubeID(value);


        if (!id) {

          message.textContent =
            "Invalid YouTube link.";

          return;

        }


        message.textContent = "";


        videoArea.innerHTML = `

          <div class="embed-box">

            <iframe
              width="100%"
              height="450"
              src="https://www.youtube.com/embed/${id}"
              title="YouTube video"
              frameborder="0"
              allowfullscreen>
            </iframe>

          </div>

        `;

        return;

      }



      if (source === "telegram") {

        const post =
          getTelegramPost(value);


        if (!post) {

          message.textContent =
            "Invalid public Telegram post link.";

          return;

        }


        message.textContent = "";


        videoArea.innerHTML = `

          <div class="embed-box">

            <blockquote
              class="telegram-post"
              data-telegram-post="${post}"
              data-width="100%">
            </blockquote>

          </div>

        `;


        const oldScript =
          document.getElementById("telegram-script");

        if (oldScript) {
          oldScript.remove();
        }


        const script =
          document.createElement("script");

        script.id = "telegram-script";

        script.async = true;

        script.src =
          "https://telegram.org/js/telegram-widget.js?22";

        document.body.appendChild(script);

      }

    }

  </script>

</body>
</html>
