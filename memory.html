<!DOCTYPE html>
<html lang="my">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>အမအတွက် အမှတ်တရ ❤️</title>

  <style>
    body {
      margin: 0;
      min-height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      background: #111;
      color: white;
      font-family: Arial, sans-serif;
      padding: 20px;
    }

    .memory {
      width: 100%;
      max-width: 500px;
      text-align: center;
      background: #1d1d1d;
      padding: 25px;
      border-radius: 20px;
    }

    .photo {
      width: 100%;
      height: 350px;
      display: flex;
      justify-content: center;
      align-items: center;
      background: #333;
      border-radius: 15px;
      color: #aaa;
      font-size: 18px;
    }

    h1 {
      margin-top: 25px;
    }

    p {
      line-height: 1.9;
      color: #ddd;
      font-size: 17px;
    }

    .heart {
      font-size: 35px;
      margin-top: 15px;
    }
  </style>
</head>

<body>

  <div class="memory">

    <div class="photo">
      ဓာတ်ပုံကို နောက်မှ ထည့်မယ် ❤️
    </div>

    <h1>အမအတွက် အမှတ်တရ ❤️</h1>

    <p>
      အမအတွက် သိမ်းထားတဲ့ အမှတ်တရလေးပါ ❤️
      <br><br>
      အချိန်တွေ ဘယ်လောက်ပဲ ပြောင်းလဲသွားပါစေ
      ဒီအမှတ်တရလေးကတော့ မပြောင်းလဲဘဲ
      ရှိနေမှာပါ။
      <br><br>
      အမ အမြဲပျော်ရွှင်ပါစေ 💕
    </p>

    <div class="heart">❤️</div>

  </div>

</body>
</html>
